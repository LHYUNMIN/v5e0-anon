<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V5e-0 vs AR</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header>
  <h1>AR vs V5e-0</h1>
</header>

<div class="controls">
  <label>Model
    <select id="model-select"></select>
  </label>
  <label>Max tokens
    <input type="number" id="max-tokens" value="64" min="8" max="256" step="8">
  </label>
</div>

<div class="input-row">
  <label class="upload-area">
    <input type="file" id="image-input" accept="image/*">
    <span id="image-label">Click or drop an image</span>
    <img id="image-preview" style="display:none">
  </label>
  <textarea id="prompt-input" rows="2"
            placeholder="Type a prompt...">Describe this image.</textarea>
  <button id="run-btn" disabled>Run</button>
</div>

<div id="status"></div>

<div class="comparison">
  <div class="pane">
    <div class="pane-header">
      <h2>AR</h2>
      <span class="metric"><span id="ar-elapsed">0</span> ms / <span id="ar-tps">0</span> tok·s⁻¹</span>
    </div>
    <div class="output" id="ar-output"></div>
  </div>

  <div class="pane">
    <div class="pane-header">
      <h2>V5e-0</h2>
      <span class="metric"><span id="ssd-elapsed">0</span> ms / <span id="ssd-tps">0</span> tok·s⁻¹</span>
    </div>
    <div class="output" id="ssd-output"></div>
  </div>
</div>

<div class="speedup-banner">
  <span id="speedup-value">—</span>×
</div>

<script src="main.js?v=3"></script>
</body>
</html>
